name: Build

on:
  workflow_dispatch:

  push:
    branches:
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.java'
      - 'gradle.properties'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: |
          ./gradlew \
            build \
            libreforgeJar \
            --full-stacktrace \
            --console=plain

      - name: Inspect generated JARs
        run: |
          echo "=== Repository ==="
          echo "${{ github.event.repository.name }}"

          echo
          echo "=== bin/ ==="
          ls -lh bin || true

          echo
          echo "=== build/libs/ ==="
          ls -lh build/libs || true

          echo
          echo "=== All generated JARs ==="
          find . \
            \( -path "*/build/libs/*.jar" -o -path "./bin/*.jar" \) \
            -type f \
            -printf "%p  %k KB\n" \
            | sort

          echo
          echo "=== Distributable JAR ==="

          JAR="$(find bin -maxdepth 1 -type f -name '*.jar' | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "No distributable JAR found in bin/"
            exit 1
          fi

          echo "$JAR"
          ls -lh "$JAR"

          echo
          echo "=== plugin.yml ==="
          unzip -p "$JAR" plugin.yml 2>/dev/null || \
          unzip -p "$JAR" paper-plugin.yml 2>/dev/null || \
          echo "No plugin.yml/paper-plugin.yml found at jar root."

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: bin/*.jar
          if-no-files-found: error
